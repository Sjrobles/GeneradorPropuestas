services:
  mongodb:
    image: mongo:8.0
    container_name: agora-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: agora
    ports:
      - "27017:27017"
    volumes:
      - agora_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agora_mongodb_data:
