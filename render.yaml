services:
  - type: web
    name: agora-api-alejofontalvo-pf-prueba
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: FRONTEND_ORIGIN
        value: https://agora-alejofontalvo-pf-prueba.onrender.com

  - type: web
    name: agora-alejofontalvo-pf-prueba
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_MODE
        value: backend
      - key: VITE_API_URL
        value: https://agora-api-alejofontalvo-pf-prueba.onrender.com/api/v1
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
